<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} IT Inventory System {% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
        }

        .navbar {
            background-color: #1f1f1f !important;
            border-bottom: 1px solid #333;
        }

        .card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            color: white;
        }

        .form-control {
            background-color: #2c2c2c;
            border: 1px solid #444;
            color: white;
        }

        .form-control:focus {
            background-color: #333;
            color: white;
            border-color: #0d6efd;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">IT Support DB</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="{% url 'add_insumo' %}">Insumos</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'add_user' %}">Usuarios</a></li>
                <li class="nav-item"><a class="nav-link" href="{% url 'add_ws' %}">Work Stations</a></li>
                <li class="nav-item ms-lg-3">
                    <a class="btn btn-outline-info btn-sm" href="{% url 'query_insumo' %}">🔍 Buscar</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
